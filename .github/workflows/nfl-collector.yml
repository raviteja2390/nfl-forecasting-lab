name: NFL cloud collector
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run one collection even if today/hour is already covered'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: nfl-persistent-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out frozen code and models
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out persistent research state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: forecast-state
          path: .cloud-state
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Restore and verify archived evidence
        id: restore
        run: python forecasting/cloud_state.py restore --state .cloud-state
      - name: Check whether collection is due
        id: plan
        env:
          FORCE: ${{ inputs.force == true && 'true' || 'false' }}
        run: |
          if [ "$FORCE" = true ]; then
            python forecasting/cloud_runner.py plan --force
          else
            python forecasting/cloud_runner.py plan
          fi
      - name: Install pinned model runtime only when collection is due
        if: steps.plan.outputs.collect == 'true'
        run: python -m pip install --disable-pip-version-check -r forecasting/requirements-training.txt
      - name: Collect, issue unchanged-model forecasts and score verified finals
        id: cycle
        if: steps.plan.outputs.collect == 'true'
        continue-on-error: true
        run: python forecasting/cloud_runner.py run
      - name: Check collection health
        id: health
        if: always() && steps.restore.outcome == 'success'
        continue-on-error: true
        run: python forecasting/cloud_runner.py health
      - name: Preserve state including failure evidence
        if: always() && steps.restore.outcome == 'success'
        run: |
          python forecasting/cloud_state.py save --state .cloud-state
          git -C .cloud-state config user.name 'github-actions[bot]'
          git -C .cloud-state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .cloud-state add files manifest.json reports collector-status.json README.md
          if ! git -C .cloud-state diff --cached --quiet; then
            git -C .cloud-state commit -m "Archive NFL observations and forecast evidence for run $GITHUB_RUN_ID"
            git -C .cloud-state push origin HEAD:forecast-state
          fi
      - name: Fail the workflow for collection or health errors
        if: always() && (steps.cycle.outcome == 'failure' || steps.health.outcome == 'failure')
        run: exit 1
      - name: Record a visible failure in the private repository
        if: failure()
        run: python forecasting/cloud_alert.py failure
      - name: Close a prior alert after recovery
        if: success()
        run: python forecasting/cloud_alert.py recovery
