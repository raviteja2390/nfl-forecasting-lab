name: NFL daily cloud watchdog
on:
  schedule:
    - cron: '47 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: nfl-cloud-watchdog
  cancel-in-progress: false
jobs:
  recover-and-check:
    # Reuse the normal due gate, collector lock, state persistence and health check.
    # No force: healthy/current slots are skipped; overdue slots get one recovery.
    uses: ./.github/workflows/nfl-collector.yml
