name: NFL daily cloud watchdog
on:
  schedule:
    - cron: '47 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: nfl-cloud-watchdog
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: forecast-state
          path: .cloud-state
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python forecasting/cloud_state.py restore --state .cloud-state
      - run: python forecasting/cloud_runner.py health
      - name: Record a stale collector or monitoring failure
        if: failure()
        run: python forecasting/cloud_alert.py failure
